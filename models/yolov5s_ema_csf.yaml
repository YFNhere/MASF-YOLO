# Ultralytics 🚀 AGPL-3.0 License

# YOLOv5s + EMA + Cross-Scale Fusion (CSF)
# Optimized for Small Object Detection

# ------------------------------------------------------------
# Design Strategy
# ------------------------------------------------------------
# 1. Preserve shallow texture details (P3)
# 2. Apply EMA only on deeper semantic features (P4/P5)
# 3. Avoid excessive attention stacking
# 4. Use CSF as auxiliary enhancement instead of replacing P3
# 5. Maintain lightweight YOLOv5s structure
# ------------------------------------------------------------

# Parameters
nc: 80
depth_multiple: 0.33
width_multiple: 0.50

anchors:
  - [10, 13, 16, 30, 33, 23]       # P3/8
  - [30, 61, 62, 45, 59, 119]      # P4/16
  - [116, 90, 156, 198, 373, 326]  # P5/32

# ------------------------------------------------------------
# Backbone
# ------------------------------------------------------------

backbone:
  [
    # 0-P1/2
    [-1, 1, Conv, [64, 6, 2, 2]],

    # 1-P2/4
    [-1, 1, Conv, [128, 3, 2]],

    # 2
    [-1, 3, C3, [128]],

    # 3-P3/8
    [-1, 1, Conv, [256, 3, 2]],

    # 4
    [-1, 6, C3, [256]],

    # 5-P4/16
    [-1, 1, Conv, [512, 3, 2]],

    # 6
    [-1, 9, C3, [512]],

    # 7-P5/32
    [-1, 1, Conv, [1024, 3, 2]],

    # 8
    [-1, 3, C3, [1024]],

    # 9
    [-1, 1, SPPF, [1024, 5]],
  ]

# ------------------------------------------------------------
# Head
# ------------------------------------------------------------

head:
  [

    # =========================================================
    # P5 -> P4
    # =========================================================

    # 10
    [-1, 1, Conv, [512, 1, 1]],

    # 11
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],

    # 12
    [[-1, 6], 1, Concat, [1]],

    # 13
    [-1, 3, C3, [512, False]],

    # =========================================================
    # P4 -> P3
    # =========================================================

    # 14
    [-1, 1, Conv, [256, 1, 1]],

    # 15
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],

    # 16
    [[-1, 4], 1, Concat, [1]],

    # 17 (P3 output)
    # Preserve shallow details
    [-1, 3, C3, [256, False]],

    # =========================================================
    # P3 -> P4
    # =========================================================

    # 18
    [-1, 1, Conv, [256, 3, 2]],

    # 19
    [[-1, 13], 1, Concat, [1]],

    # 20
    [-1, 1, EMA, []],

    # 21 (P4 output)
    [-1, 3, C3, [512, False]],

    # =========================================================
    # P4 -> P5
    # =========================================================

    # 22
    [-1, 1, Conv, [512, 3, 2]],

    # 23
    [[-1, 10], 1, Concat, [1]],

    # 24
    [-1, 1, EMA, []],

    # 25 (P5 output)
    [-1, 3, C3, [1024, False]],

    # =========================================================
    # Cross-Scale Fusion (Auxiliary Enhancement)
    # =========================================================

    # 26
    [[17, 21, 25], 1, CrossScaleFusion, [128]],

    # =========================================================
    # Detect
    # =========================================================
    # IMPORTANT:
    # Keep original P3/P4/P5 outputs for detection
    # Avoid replacing P3 directly with CSF output
    # to preserve small-object texture information
    # =========================================================

    [[17, 21, 25], 1, Detect, [nc, anchors]],
  ]