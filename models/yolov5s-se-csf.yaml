# YOLOv5s with Squeeze-Excitation (SE) Attention and Cross-Scale Fusion (CSF)
# 方案1：调整CSF融合位置 - 先融合后增强

nc: 80  # number of classes
depth_multiple: 0.33  # model depth multiple
width_multiple: 0.50  # layer channel multiple
anchors:
  - [10, 13, 16, 30, 33, 23]  # P3/8
  - [30, 61, 62, 45, 59, 119]  # P4/16
  - [116, 90, 156, 198, 373, 326]  # P5/32

# YOLOv5 v6.0 backbone with SE attention
backbone:
  # [from, number, module, args]
  [
    [-1, 1, Conv, [64, 6, 2, 2]],  # 0-P1/2
    [-1, 1, Conv, [128, 3, 2]],  # 1-P2/4
    [-1, 3, C3SE, [128]],  # 2 - C3 with SE attention
    [-1, 1, Conv, [256, 3, 2]],  # 3-P3/8
    [-1, 6, C3SE, [256]],  # 4 - C3 with SE attention
    [-1, 1, Conv, [512, 3, 2]],  # 5-P4/16
    [-1, 9, C3SE, [512]],  # 6 - C3 with SE attention
    [-1, 1, Conv, [1024, 3, 2]],  # 7-P5/32
    [-1, 3, C3SE, [1024]],  # 8 - C3 with SE attention
    [-1, 1, SPPF, [1024, 5]],  # 9
  ]

# YOLOv5 v6.0 head - 先融合(CSF)后增强(SE)
head: [
    [-1, 1, Conv, [512, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 6], 1, Concat, [1]],  # cat backbone P4
    [-1, 3, C3, [512, False]],  # 13 - 使用普通C3，避免提前改变特征分布

    [-1, 1, Conv, [256, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 4], 1, Concat, [1]],  # cat backbone P3
    [-1, 3, C3, [256, False]],  # 17 (P3/8-small) - 使用普通C3

    [-1, 1, Conv, [256, 3, 2]],
    [[-1, 14], 1, Concat, [1]],  # cat head P4
    [-1, 3, C3, [512, False]],  # 20 (P4/16-medium) - 使用普通C3

    [-1, 1, Conv, [512, 3, 2]],
    [[-1, 10], 1, Concat, [1]],  # cat head P5
    [-1, 3, C3, [1024, False]],  # 23 (P5/32-large) - 使用普通C3

    [[17, 20, 23], 1, CrossScaleFusion, [128]],  # 先进行跨尺度融合
    [-1, 1, C3SE, [128, False]],  # 再用SE增强融合结果

    [[25, 20, 23], 1, Detect, [nc, anchors]],  # Detect(P3 with CSF+SE, P4, P5)
  ]